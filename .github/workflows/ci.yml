name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.lock
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Compile backend
        run: python -m compileall -q backend launchers
      - name: Validate Linux installer scripts
        run: bash -n packaging/linux/install.sh packaging/linux/uninstall.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ""
        run: npm run build
      - name: Verify production API is same-origin
        shell: bash
        run: |
          ! grep -R --include='main.*.js' -F 'baseURL:"http://localhost:8000"' frontend/build/static/js

      - name: Verify production application
        run: python -m pytest tests
