name: Android remote client check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded web client
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Prepare API 35 SDK
        run: bash packaging/android/setup_ci_sdk.sh 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build client and device tests
        working-directory: packaging/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash gradlew --no-daemon :shared:testDebugUnitTest :client-app:testArm64DebugUnitTest :client-app:lintArm64Debug :client-app:assembleArm64Debug :client-app:assembleArm64DebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-client-debug-${{ github.sha }}
          path: packaging/android/client-app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run client device tests on Android API 35
        working-directory: packaging/android
        run: |
          set -euo pipefail
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager emulator "$image"
          echo no | avdmanager create avd --name client-ci --package "$image" --device pixel_5
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" @client-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/client-emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash gradlew --no-daemon :client-app:connectedX86TestDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-client-device-results-${{ github.sha }}
          path: packaging/android/client-app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
