name: Android CI

on:
  push:
    branches: ["main", "codex/android-*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      frontend_artifact:
        description: Built frontend from the calling Release workflow
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 and frontend quality checks
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend with Android Python version
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock pytest httpx
          python -m pytest backend/tests
      - name: Test Android frontend integration
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run test:tooling
      - name: Build embedded frontend
        if: ${{ !inputs.frontend_artifact }}
        working-directory: frontend
        env:
          REACT_APP_API_URL: ""
        run: |
          npm run build
          npm run test:performance
      - name: Reuse release frontend
        if: ${{ inputs.frontend_artifact }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.frontend_artifact }}
          path: frontend/build
      - name: Test production resources
        run: python -m pytest tests
      - name: Share tested frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-web-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

  wheels:
    name: Native Python wheels (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64_v8a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Restore locked native wheels
        id: wheels-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packaging/android/wheelhouse
          key: android-wheels-v1-${{ matrix.abi }}-${{ hashFiles('packaging/android/recipes/*.py', 'packaging/android/recipes/sources.json', 'packaging/android/requirements-android.txt', 'packaging/android/build_android_wheels.sh') }}
      - name: Install native build tools
        if: steps.wheels-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config patchelf
          bash packaging/android/setup_ci_sdk.sh "ndk;27.2.12479018"
      - name: Build locked Python wheels
        if: steps.wheels-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash packaging/android/build_android_wheels.sh "${{ matrix.abi }}"
      - name: Share locked wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-wheels-${{ matrix.abi }}
          path: packaging/android/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  android:
    name: Debug APKs (${{ matrix.abi }})
    needs: [quality, wheels]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: x86_64
            flavor: X86Test
            directory: x86Test
          - abi: arm64_v8a
            flavor: Arm64
            directory: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-web-build
          path: frontend/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-wheels-${{ matrix.abi }}
          path: packaging/android/wheelhouse
      - name: Restore Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-v1-${{ matrix.abi }}-${{ hashFiles('packaging/android/**/*.gradle', 'packaging/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install APK build tools
        run: bash packaging/android/setup_ci_sdk.sh "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APKs
        working-directory: packaging/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash gradlew --no-daemon :shared:testDebugUnitTest test${{ matrix.flavor }}DebugUnitTest \
            :client-app:lint${{ matrix.flavor }}Debug :local-app:lint${{ matrix.flavor }}Debug \
            :client-app:assemble${{ matrix.flavor }}Debug :local-app:assemble${{ matrix.flavor }}Debug
      - name: Start API 35 emulator
        if: matrix.abi == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force \
            --name neu-ci --package "system-images;android-35;google_apis;x86_64" --device pixel_5
          sudo chmod 666 /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" @neu-ci \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Test bundled pages, Python dependencies and token isolation
        if: matrix.abi == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          client_apk="packaging/android/client-app/build/outputs/apk/x86Test/debug/client-app-x86Test-debug.apk"
          local_apk="packaging/android/local-app/build/outputs/apk/x86Test/debug/local-app-x86Test-debug.apk"
          adb install "$client_apk"
          adb install -g "$local_apk"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cd packaging/android
          bash gradlew --no-daemon :client-app:connectedX86TestDebugAndroidTest \
            :local-app:connectedX86TestDebugAndroidTest
      - name: Collect emulator diagnostics
        if: always() && matrix.abi == 'x86_64'
        shell: bash
        run: |
          mkdir -p packaging/android/diagnostics
          if adb get-state 2>/dev/null | grep -qx device; then
            adb logcat -d > packaging/android/diagnostics/logcat.txt
            adb exec-out screencap -p > packaging/android/diagnostics/final-screen.png
            adb pull /sdcard/Android/data/io.github.rekayoo.neujwxt.client.test.debug/files/test-screenshots packaging/android/diagnostics/client || true
            adb pull /sdcard/Android/data/io.github.rekayoo.neujwxt.local.test.debug/files/test-screenshots packaging/android/diagnostics/local || true
          fi
          if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then
            cp "$RUNNER_TEMP/emulator.log" packaging/android/diagnostics/
          fi
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-reports-${{ matrix.abi }}
          path: |
            packaging/android/*/build/reports/
            packaging/android/*/build/outputs/androidTest-results/
            packaging/android/diagnostics/
          if-no-files-found: ignore
      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-${{ matrix.abi }}
          path: packaging/android/*/build/outputs/apk/${{ matrix.directory }}/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
