name: Android CI

on:
  push:
    branches: ["main", "codex/android-*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      frontend_artifact:
        description: Built frontend from the calling Release workflow
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  android:
    name: Python 3.13, x86_64 APKs and emulator smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend with Android Python version
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock pytest httpx
          python -m pytest backend/tests
      - name: Test Android frontend integration
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run test:tooling
      - name: Build embedded frontend
        if: ${{ !inputs.frontend_artifact }}
        working-directory: frontend
        env:
          REACT_APP_API_URL: ""
        run: |
          npm run build
          npm run test:performance
      - name: Reuse release frontend
        if: ${{ inputs.frontend_artifact }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.frontend_artifact }}
          path: frontend/build
      - name: Test production resources
        run: python -m pytest tests
      - name: Install Android SDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config patchelf
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "system-images;android-35;google_apis;x86_64"
      - name: Build locked x86_64 Python wheels
        shell: bash
        run: bash packaging/android/build_android_wheels.sh x86_64
      - name: Build and test x86_64 debug APKs
        working-directory: packaging/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash gradlew --no-daemon :shared:testDebugUnitTest testX86TestDebugUnitTest \
            :client-app:lintX86TestDebug :local-app:lintX86TestDebug \
            :client-app:assembleX86TestDebug :local-app:assembleX86TestDebug \
            :client-app:assembleX86TestDebugAndroidTest :local-app:assembleX86TestDebugAndroidTest
      - name: Start API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd --force \
            --name neu-ci --package "system-images;android-35;google_apis;x86_64" --device pixel_5
          sudo chmod 666 /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" @neu-ci \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Test bundled pages, Python dependencies and token isolation
        shell: bash
        run: |
          set -euo pipefail
          client_apk="packaging/android/client-app/build/outputs/apk/x86Test/debug/client-app-x86Test-debug.apk"
          local_apk="packaging/android/local-app/build/outputs/apk/x86Test/debug/local-app-x86Test-debug.apk"
          adb install "$client_apk"
          adb install -g "$local_apk"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cd packaging/android
          bash gradlew --no-daemon :client-app:connectedX86TestDebugAndroidTest \
            :local-app:connectedX86TestDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-reports
          path: packaging/android/*/build/reports/
          if-no-files-found: ignore
      - name: Upload debug APKs and native wheels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-build
          path: |
            packaging/android/*/build/outputs/apk/x86Test/debug/*.apk
            packaging/android/wheelhouse/*.whl
          if-no-files-found: ignore
          retention-days: 7
