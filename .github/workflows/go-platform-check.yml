name: Go Linux and Docker acceptance
on:
  workflow_call:
    inputs:
      frontend_artifact:
        description: Production frontend from the calling workflow
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    branches-ignore: [refactor/go-web-toolbox]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'go.*'
      - 'go.Dockerfile*'
      - '.dockerignore'
      - 'VERSION'
      - 'LICENSE'
      - 'backend/core/course_selection/THIRD_PARTY_NOTICE.md'
      - 'tools/prepare_frontend_assets.mjs'
      - 'tools/check_performance_budget.mjs'
      - 'tools/frontend_performance_budget.json'
      - 'tools/*go_release.py'
      - 'tools/check_go_https.go'
      - 'tools/check_appearance.cjs'
      - 'tools/check_admin.cjs'
      - 'tools/check_timetable_day_agenda.cjs'
      - 'packaging/go/**'
      - 'docs/部署/Go运行包.md'
      - 'docs/部署/Go备份与恢复.md'
      - 'docs/部署/旧版资料导入.md'
      - '.github/workflows/go-platform-check.yml'
permissions:
  contents: read
jobs:
  linux-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: python3 packaging/go/test_install_server.py
      - uses: actions/download-artifact@v4
        if: inputs.frontend_artifact != ''
        with:
          name: ${{ inputs.frontend_artifact }}
          path: frontend/build
      - name: Build Go distributions
        shell: bash
        env:
          FRONTEND_ARTIFACT: ${{ inputs.frontend_artifact }}
        run: |
          set -euo pipefail
          if [[ -n "$FRONTEND_ARTIFACT" ]]; then
            python3 tools/build_go_release.py --use-built-frontend
          else
            python3 tools/build_go_release.py
          fi
      - run: python3 tools/check_go_release.py dist/go-release --smoke
      - name: Install and migrate alongside the legacy systemd service
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          bundle="NEU-JWXT-Toolkit-${version}-linux-amd64-go"
          archive="dist/go-release/$bundle.tar.gz"
          manifest=dist/go-release/go-release-manifest.json
          origin=https://toolbox.example.invalid
          installer=$(mktemp)
          tar -xOzf "$archive" "$bundle/install.sh" > "$installer"
          bash -n "$installer"
          bash "$installer" --help >/dev/null
          printf '[Service]\nExecStart=/usr/bin/sleep infinity\n' | sudo tee /etc/systemd/system/neu-jwxt-toolkit.service >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start neu-jwxt-toolkit
          cookies=$(mktemp)
          invalid=$(mktemp)
          trap 'rm -f "$installer" "$cookies" "$invalid"; sudo systemctl stop neu-toolbox neu-jwxt-toolkit || true' EXIT
          jq '.assets["linux-amd64"].sha256 = ("0" * 64)' "$manifest" > "$invalid"
          if bash "$installer" --origin "$origin" --archive "$archive" --manifest "$invalid"; then
            exit 1
          fi
          test ! -e /opt/neu-toolbox
          bash "$installer" --origin "$origin" --version "v$version" --archive "$archive" --manifest "$manifest"
          go run tools/check_go_https.go /opt/neu-toolbox/toolbox
          sudo systemctl is-active --quiet neu-jwxt-toolkit
          test "$(sudo systemctl is-enabled neu-toolbox || true)" = disabled
          test "$(stat -c '%a %U %G' /etc/neu-toolbox.env)" = '600 root root'
          base=http://localhost:18000/api
          curl -4fsS "$base/health" | jq -e --arg version "$version" '.backend == "go" and .version == $version'
          test "$(stat -c '%a %U %G' /var/lib/neu-toolbox)" = '700 neu-toolbox neu-toolbox'
          test "$(curl -4s -o /dev/null -w '%{http_code}' "$base/status")" = 401
          export TEST_ACCESS_PASSWORD="$(sudo sed -n 's/^NEU_JWXT_ACCESS_PASSWORD=//p' /etc/neu-toolbox.env)"
          export TEST_ADMIN_PASSWORD="$(sudo sed -n 's/^NEU_JWXT_ADMIN_PASSWORD=//p' /etc/neu-toolbox.env)"
          printf 'NEU_JWXT_PUBLIC_ORIGIN=https://toolbox.example.invalid\n' | sudo tee /etc/neu-toolbox.env >/dev/null
          sudo systemctl restart neu-toolbox
          curl -4fsS --retry 20 --retry-delay 1 --retry-connrefused "$base/health" | jq -e --arg version "$version" '.backend == "go" and .version == $version'
          jq -nc '{password:env.TEST_ACCESS_PASSWORD}' | curl -4fsS -c "$cookies" -H 'Content-Type: application/json' -d @- "$base/access/login" | jq -e '.success == true'
          test "$(curl -4s -b "$cookies" -o /dev/null -w '%{http_code}' "$base/admin/accounts")" = 401
          jq -nc '{password:env.TEST_ADMIN_PASSWORD}' | curl -4fsS -b "$cookies" -c "$cookies" -H 'Content-Type: application/json' -d @- "$base/admin/login" | jq -e '.success == true'
          curl -4fsS -b "$cookies" -H 'Content-Type: application/json' -d '{"account":"20990001"}' "$base/admin/accounts" >/dev/null
          if bash "$installer" --origin "$origin" --archive "$archive" --manifest "$manifest"; then
            exit 1
          fi
          sudo install -d -m 0700 /var/lib/neu-jwxt-toolkit/成绩
          printf '{"courses":[],"export_info":{"exported_by":"20990001"}}\n' | sudo tee /var/lib/neu-jwxt-toolkit/成绩/example.json >/dev/null
          old_checksum=$(sudo sha256sum /var/lib/neu-jwxt-toolkit/成绩/example.json)
          if sudo python3 /opt/neu-toolbox/migrate-legacy.py --account 20990001; then
            exit 1
          fi
          sudo systemctl stop neu-toolbox
          preview=$(sudo python3 /opt/neu-toolbox/migrate-legacy.py --account 20990001)
          digest=$(jq -er 'select(.applied == 0 and (.items | length) == 1) | .digest' <<< "$preview")
          sudo python3 /opt/neu-toolbox/migrate-legacy.py --account 20990001 --apply-digest "$digest" | jq -e '.applied == 1'
          sudo python3 /opt/neu-toolbox/migrate-legacy.py --account 20990001 | jq -e '.applied == 0 and (.items | length) == 1 and .items[0].status == "unchanged"'
          test "$old_checksum" = "$(sudo sha256sum /var/lib/neu-jwxt-toolkit/成绩/example.json)"
          sudo systemctl is-active --quiet neu-jwxt-toolkit
          sudo systemctl start neu-toolbox
          bash packaging/go/check-maintenance.sh "$installer" "$archive" "$manifest"
      - name: Upload verified Windows and Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: go-web-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/go-release/*-windows-amd64-go.zip
            dist/go-release/*-linux-amd64-go.tar.gz
            dist/go-release/go-release-manifest.json
            dist/go-release/SHA256SUMS
            dist/go-release/verification.json
  linux-fresh-install:
    needs: linux-archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: go-web-${{ github.sha }}
          path: dist/go-release
      - name: Install from a clean host and restart with saved credentials
        shell: bash
        run: |
          set -euo pipefail
          manifest=dist/go-release/go-release-manifest.json
          version=$(jq -er '.version' "$manifest")
          archive="dist/go-release/$(jq -er '.assets["linux-amd64"].name' "$manifest")"
          installer=$(mktemp)
          cookies=$(mktemp)
          trap 'rm -f "$installer" "$cookies"; sudo systemctl stop neu-toolbox || true' EXIT
          tar -xOzf "$archive" "NEU-JWXT-Toolkit-${version}-linux-amd64-go/install.sh" > "$installer"
          test "$(systemctl show --property=LoadState --value neu-jwxt-toolkit)" = not-found
          test "$(systemctl show --property=LoadState --value neu-toolbox)" = not-found
          bash "$installer" install --origin https://toolbox.example.invalid --mode remote-single --archive "$archive" --manifest "$manifest"
          systemctl is-enabled --quiet neu-toolbox
          systemctl is-active --quiet neu-toolbox
          test "$(stat -c '%a %U %G' /etc/neu-toolbox.env)" = '600 root root'
          test "$(stat -c '%a %U %G' /var/lib/neu-toolbox)" = '700 neu-toolbox neu-toolbox'
          base=http://localhost:8000/api
          curl -4fsS "$base/health" | jq -e --arg version "$version" '.backend == "go" and .version == $version and .deployment_mode == "remote-single"'
          test "$(curl -4s -o /dev/null -w '%{http_code}' "$base/status")" = 401
          export TEST_ACCESS_PASSWORD="$(sudo sed -n 's/^NEU_JWXT_ACCESS_PASSWORD=//p' /etc/neu-toolbox.env)"
          export TEST_ADMIN_PASSWORD="$(sudo sed -n 's/^NEU_JWXT_ADMIN_PASSWORD=//p' /etc/neu-toolbox.env)"
          sudo sed -i '/^NEU_JWXT_.*_PASSWORD=/d' /etc/neu-toolbox.env
          sudo systemctl restart neu-toolbox
          curl -4fsS --retry 20 --retry-delay 1 --retry-connrefused "$base/health" | jq -e --arg version "$version" '.version == $version'
          jq -nc '{password:env.TEST_ACCESS_PASSWORD}' | curl -4fsS -c "$cookies" -H 'Content-Type: application/json' -d @- "$base/access/login" | jq -e '.success == true'
          test "$(curl -4s -b "$cookies" -o /dev/null -w '%{http_code}' "$base/admin/accounts")" = 401
          jq -nc '{password:env.TEST_ADMIN_PASSWORD}' | curl -4fsS -b "$cookies" -c "$cookies" -H 'Content-Type: application/json' -d @- "$base/admin/login" | jq -e '.success == true'
          curl -4fsS -b "$cookies" "$base/admin/accounts" | jq -e '.accounts == [] and .deployment_mode == "remote-single"'
  debian-reboot:
    needs: linux-archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/selection.test" ./internal/application
      - uses: actions/download-artifact@v4
        with:
          name: go-web-${{ github.sha }}
          path: dist/go-release
      - name: Verify service autostart and access after guest reboot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          image=debian-12-nocloud-amd64.qcow2
          base=https://cloud.debian.org/images/cloud/bookworm/latest
          curl -fsSL --retry 3 "$base/$image" -o "$RUNNER_TEMP/$image"
          curl -fsSL --retry 3 "$base/SHA512SUMS" -o "$RUNNER_TEMP/debian-sums"
          (cd "$RUNNER_TEMP" && grep "  $image$" debian-sums | sha512sum -c -)
          sudo chmod 666 /dev/kvm
          python3 tools/check_debian_service.py --kvm --selection-test "$RUNNER_TEMP/selection.test" /usr/bin/qemu-system-x86_64 "$RUNNER_TEMP/$image" dist/go-release/*-linux-amd64-go.tar.gz
  windows-archive:
    needs: linux-archive
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: go-web-${{ github.sha }}
          path: dist/go-release
      - run: python tools/check_go_release.py dist/go-release --smoke --report dist/windows-verification.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix frontend
      - name: Check appearance in the packaged web client
        shell: pwsh
        env:
          NEU_QA_BROWSER: msedge
        run: |
          $archive = Get-Item dist/go-release/*-windows-amd64-go.zip
          $destination = Join-Path $env:RUNNER_TEMP 'appearance-package'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
          node tools/check_appearance.cjs (Join-Path $destination $archive.BaseName)
      - name: Verify timetable downloads in the packaged web client
        shell: pwsh
        run: |
          $archive = Get-Item dist/go-release/*-windows-amd64-go.zip
          node tools/check_timetable_day_agenda.cjs (Join-Path $env:RUNNER_TEMP "appearance-package/$($archive.BaseName)")
      - name: Verify administrator workflows in the packaged web client
        shell: pwsh
        run: |
          $archive = Get-Item dist/go-release/*-windows-amd64-go.zip
          $env:QA_FRONTEND_BUILD = Join-Path $env:RUNNER_TEMP "appearance-package/$($archive.BaseName)/frontend/build"
          node tools/check_admin.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verification-${{ github.sha }}
          path: dist/windows-verification.json
          retention-days: 7
          if-no-files-found: error
  docker-runtime:
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Go Linux and Docker acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check startup, access boundary and restart
        shell: bash
        run: |
          set -euo pipefail
          export NEU_JWXT_ACCESS_PASSWORD="$(openssl rand -hex 24)"
          export NEU_JWXT_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export NEU_JWXT_PUBLIC_ORIGIN=https://toolbox.example.invalid
          compose=(docker compose -p "toolbox-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f packaging/go/compose.yaml)
          version=$(cat VERSION)
          trap '"${compose[@]}" down -v' EXIT
          "${compose[@]}" up --build -d
          for pass in 1 2; do
            container=$("${compose[@]}" ps -q toolbox)
            curl -fsS --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/api/health | jq -e --arg version "$version" '.backend == "go" and .version == $version and (.shutdown_token // "") == ""'
            curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/status)" = 401
            test "$(docker exec "$container" id -u)" = 10001
            test "$(docker exec "$container" stat -c '%a %u %g' /data)" = '700 10001 10001'
            docker exec "$container" cat /app/licenses/dependencies.json | jq -er 'select(any(.[]; .ecosystem == "go") and any(.[]; .ecosystem == "npm")) | .[].license_files[]' > "$RUNNER_TEMP/toolbox-license-paths"
            docker exec -i "$container" sh -ec 'while IFS= read -r file; do test -s "/app/licenses/$file"; done' < "$RUNNER_TEMP/toolbox-license-paths"
            cookies=$(mktemp)
            base=http://localhost:8000/api
            jq -nc '{password:env.NEU_JWXT_ACCESS_PASSWORD}' | curl -4fsS -c "$cookies" -H 'Content-Type: application/json' -d @- "$base/access/login" | jq -e '.success == true'
            test "$(curl -4s -b "$cookies" -o /dev/null -w '%{http_code}' "$base/admin/accounts")" = 401
            jq -nc '{password:env.NEU_JWXT_ADMIN_PASSWORD}' | curl -4fsS -b "$cookies" -c "$cookies" -H 'Content-Type: application/json' -d @- "$base/admin/login" | jq -e '.success == true'
            curl -4fsS -b "$cookies" "$base/admin/accounts" >/dev/null
            rm -f "$cookies"
            if [ "$pass" = 1 ]; then
              NEU_JWXT_ACCESS_PASSWORD= NEU_JWXT_ADMIN_PASSWORD= "${compose[@]}" up -d --force-recreate
              test "$("${compose[@]}" ps -q toolbox)" != "$container"
            fi
          done
