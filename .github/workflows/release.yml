name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs opt in to additional permissions only where required.
permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate VERSION and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a supported semantic version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION v$version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1
            tag_query_status=$?
            set -e
            if [[ "$tag_query_status" -eq 0 ]]; then
              echo "VERSION v$version is already published; bump VERSION before building new release candidates" >&2
              exit 1
            fi
            if [[ "$tag_query_status" -ne 2 ]]; then
              echo "Unable to verify whether VERSION v$version already exists (git ls-remote exit $tag_query_status)" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  web:
    name: Build web assets
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        env:
          REACT_APP_API_URL: ""
        run: npm run build
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build and verify Windows release
    needs: [validate, web]
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-build
          path: frontend/build
      - run: python -m pip install --disable-pip-version-check -r requirements-build.lock
      - name: Compile standalone desktop application with Nuitka
        run: python packaging/nuitka/build.py desktop

      - name: Validate Windows executable metadata and bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          python tools/check_release_bundle.py .\dist\NEU-JWXT-Toolkit
          if ($LASTEXITCODE -ne 0) { throw "Desktop bundle validation failed" }

          $launcher = (Resolve-Path ".\dist\NEU-JWXT-Toolkit\NEU-JWXT-Toolkit.exe").Path
          $versionInfo = (Get-Item -LiteralPath $launcher).VersionInfo
          $numericVersion = (($env:RELEASE_VERSION -split "[.-]")[0..2] -join ".") + ".0"
          if ($versionInfo.ProductName -ne "NEU JWXT Toolkit" -or
              $versionInfo.CompanyName -ne "NEU-JWXT-Toolkit Contributors" -or
              $versionInfo.FileVersion -ne $numericVersion -or
              $versionInfo.ProductVersion -ne $numericVersion) {
            throw "Windows executable metadata is missing or inconsistent"
          }
          "Windows executable: $($versionInfo.ProductName) $($versionInfo.ProductVersion); publisher metadata: $($versionInfo.CompanyName)" `
            | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Create portable archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path ".\release" | Out-Null
          $archive = ".\release\NEU-JWXT-Toolkit-$env:RELEASE_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path ".\dist\NEU-JWXT-Toolkit\*" -DestinationPath $archive

      - name: Extract and smoke test final portable archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          NEU_JWXT_NO_BROWSER: "1"
          NEU_JWXT_NO_TRAY: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $archive = (Resolve-Path ".\release\NEU-JWXT-Toolkit-$env:RELEASE_VERSION-windows-x64-portable.zip").Path
          $extractRoot = Join-Path $env:RUNNER_TEMP "portable-final-smoke"
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          python tools/check_release_bundle.py $extractRoot
          if ($LASTEXITCODE -ne 0) { throw "Portable bundle validation failed" }
          $sourceRoot = (Resolve-Path ".\dist\NEU-JWXT-Toolkit").Path
          $sourceManifest = @(
            Get-ChildItem -LiteralPath $sourceRoot -File -Recurse | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($sourceRoot, $_.FullName)
              "$relative=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            } | Sort-Object
          )
          $archiveManifest = @(
            Get-ChildItem -LiteralPath $extractRoot -File -Recurse | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($extractRoot, $_.FullName)
              "$relative=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            } | Sort-Object
          )
          if (Compare-Object $sourceManifest $archiveManifest) {
            throw "Portable archive contents differ from the validated standalone payload"
          }

          $launcher = Join-Path $extractRoot "NEU-JWXT-Toolkit.exe"
          $instance = Join-Path $env:LOCALAPPDATA "NEU-JWXT-Toolkit\desktop-instance.json"
          $process = Start-Process -FilePath $launcher -WindowStyle Hidden -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 120; $i++) {
              if (Test-Path -LiteralPath $instance) {
                $state = Get-Content -LiteralPath $instance -Raw | ConvertFrom-Json
                if ($state.pid -ne $process.Id) {
                  Start-Sleep -Milliseconds 250
                  continue
                }
                $instanceUri = [Uri]$state.url
                if ($instanceUri.Scheme -ne "http" -or $instanceUri.Host -ne "127.0.0.1" `
                    -or $instanceUri.AbsolutePath -ne "/" -or $instanceUri.Query) {
                  throw "Desktop instance URL is not a clean loopback HTTP origin"
                }
                try {
                  $health = Invoke-RestMethod "$($state.url)/api/health" -TimeoutSec 1
                  if ($health.status -eq "ok" -and $health.profile -eq "desktop" `
                      -and -not [string]::IsNullOrWhiteSpace($health.shutdown_token)) {
                    $healthy = $true
                    break
                  }
                } catch {}
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $healthy) { throw "Extracted portable health check failed" }
            $homepage = Invoke-WebRequest "$($state.url)/app" -UseBasicParsing -TimeoutSec 5
            if ($homepage.StatusCode -ne 200 -or $homepage.Content -notmatch 'id="root"') {
              throw "Extracted portable homepage check failed"
            }
            $second = Start-Process -FilePath $launcher -WindowStyle Hidden -PassThru
            if (-not $second.WaitForExit(5000) -or $second.ExitCode -ne 0) {
              Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue
              throw "Extracted portable single-instance check failed"
            }
            Invoke-RestMethod "$($state.url)/api/runtime/shutdown" -Method Post -TimeoutSec 5 `
              -Headers @{ "X-NEU-Shutdown-Token" = $health.shutdown_token } | Out-Null
            if (-not $process.WaitForExit(10000)) { throw "Extracted portable shutdown check failed" }
            if ($process.ExitCode -ne 0) { throw "Extracted portable exited with code $($process.ExitCode)" }
            if (Test-Path -LiteralPath $instance) { throw "Extracted portable left its instance file behind" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Record Windows security status
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $statusFile = ".\release\WINDOWS-SECURITY-STATUS.txt"
          "Packaging policy: inspectable Nuitka standalone portable ZIP; no onefile or UPX. The launcher is unsigned but carries stable product and version metadata." | Set-Content -LiteralPath $statusFile -Encoding utf8
          "Unsigned setup.exe publishing is suspended until reliable Authenticode signing is available." | Add-Content -LiteralPath $statusFile -Encoding utf8
          "Automated antivirus scanning is not used as a release gate. Verify SHA256SUMS.txt and the GitHub artifact attestation before running the package." | Add-Content -LiteralPath $statusFile -Encoding utf8
          "Windows packaging: **compiled standalone portable ZIP; unsigned installer suspended**." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build and verify Linux release
    needs: [validate, web]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-build
          path: frontend/build
      - run: python -m pip install --disable-pip-version-check -r requirements-build.lock
      - name: Install Linux compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential patchelf ccache
      - name: Compile standalone server application with Nuitka
        run: python packaging/nuitka/build.py server

      - name: Assemble normalized Linux archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package="release/neu-jwxt-toolkit"
          mkdir -p "$package/app" "$package/examples"
          cp -a dist/neu-jwxt-server/. "$package/app/"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/neu-jwxt-toolkit.service "$package/"
          cp packaging/linux/examples/* "$package/examples/"
          chmod +x "$package/install.sh" "$package/uninstall.sh" "$package/app/neu-jwxt-server"
          python tools/check_release_bundle.py dist/neu-jwxt-server "$package" "$package/app"
          source_date_epoch="$(git log -1 --format=%ct)"
          archive="release/NEU-JWXT-Toolkit-$RELEASE_VERSION-linux-amd64.tar.gz"
          tar --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner \
            --pax-option=delete=atime,delete=ctime \
            -C release -cf - neu-jwxt-toolkit | gzip -n > "$archive"

      - name: Extract and smoke test final Linux archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          extract_root="$RUNNER_TEMP/linux-final-smoke"
          mkdir -p "$extract_root"
          tar -xzf "release/NEU-JWXT-Toolkit-$RELEASE_VERSION-linux-amd64.tar.gz" -C "$extract_root"
          package="$extract_root/neu-jwxt-toolkit"
          python tools/check_release_bundle.py "$package" "$package/app"
          test "$("$package/app/neu-jwxt-server" --version)" = "$RELEASE_VERSION"

          config_root="$RUNNER_TEMP/neu-config"
          data_root="$RUNNER_TEMP/neu-data"
          mkdir -p "$config_root" "$data_root"
          python - <<'PY'
          import json, os, secrets
          from pathlib import Path
          from backend.core.runtime.access import hash_access_password

          target = Path(os.environ["RUNNER_TEMP"]) / "neu-config" / "config.json"
          target.write_text(json.dumps({
              "profile": "server",
              "host": "127.0.0.1",
              "port": 18765,
              "access_password": hash_access_password("release-test-password"),
              "session_secret": secrets.token_urlsafe(48),
              "trusted_proxies": ["127.0.0.1"],
          }), encoding="utf-8")
          PY
          config="$config_root/config.json"
          NEU_JWXT_DATA_DIR="$data_root" \
            "$package/app/neu-jwxt-server" serve --config "$config" \
            >"$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18765/api/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18765/api/health >/dev/null
          curl --fail --silent http://127.0.0.1:18765/ | grep -q 'id="root"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/status)" = "401"
          HTTP_PROXY=http://127.0.0.1:1 \
            HTTPS_PROXY=http://127.0.0.1:1 \
            NO_PROXY="" \
            "$package/app/neu-jwxt-server" healthcheck --config "$config"
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-release
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      # actions/attest v4.0.0
      - name: Attest release files
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
