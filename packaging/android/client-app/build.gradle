plugins {
    id "com.android.application"
}

def signingValues = [
    file: System.getenv("ANDROID_KEYSTORE_FILE"),
    storePassword: System.getenv("ANDROID_SIGNING_STORE_PASSWORD"),
    alias: System.getenv("ANDROID_SIGNING_KEY_ALIAS"),
    keyPassword: System.getenv("ANDROID_SIGNING_KEY_PASSWORD"),
]
def releaseSigningReady = signingValues.values().every { it != null && !it.isBlank() }

android {
    namespace "io.github.rekayoo.neujwxt.client"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.github.rekayoo.neujwxt.client"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.androidVersionCode
        versionName rootProject.ext.toolkitVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "abi"
    productFlavors {
        arm64 {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        x86Test {
            dimension "abi"
            applicationIdSuffix ".test"
            versionNameSuffix "-x86-test"
            ndk { abiFilters "x86_64" }
        }
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(signingValues.file)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }

    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestedRelease = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains("release")
    }
    if (requestedRelease && !releaseSigningReady) {
        throw new GradleException("Android release signing Secrets are required")
    }
}

dependencies {
    implementation project(":shared")
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
